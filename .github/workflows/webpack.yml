name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDummyApiKeyForBuild123456789"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-app.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-app"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-app.appspot.com"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
        NEXT_PUBLIC_SUPABASE_URL: "https://demo.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
        NEXT_PUBLIC_TMDB_API_KEY: "dummy_tmdb_api_key_for_build"

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDummyApiKeyForBuild123456789"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-app.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-app"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-app.appspot.com"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
        NEXT_PUBLIC_SUPABASE_URL: "https://demo.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
        NEXT_PUBLIC_TMDB_API_KEY: "dummy_tmdb_api_key_for_build"
